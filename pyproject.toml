[project]
name = "day37-bank-qa-homework"
version = "0.2.0"
description = "Day37 银行智能问答系统：Elasticsearch + Redis + Neo4j + LangChain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "elasticsearch>=8.18,<8.19",
    "fastapi>=0.115,<1",
    "langchain-core>=1.0,<2",
    "neo4j>=5.26,<5.27",
    "redis>=5.2,<6",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["day37_bank_qa", "exercise05"]
package-dir = {day37_bank_qa = "src/day37_bank_qa", exercise05 = "exercise05"}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
